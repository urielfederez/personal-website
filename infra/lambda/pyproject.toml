[project]
name = "lambda"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["boto3>=1.43.114"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-env>=1.8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
env = [
    "TURNSTILE_SECRET_PARAMETER=/test/turnstile-secret",
    "QUOTA_TABLE_NAME=test-contact-form-quota",
    "SES_FROM_ADDRESS=contact@example.com",
    "SES_TO_ADDRESS=recipient@example.com",
]
